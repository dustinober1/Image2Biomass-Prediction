# Basic Experiment Configuration
#
# This configuration demonstrates a simple experiment definition for training
# an EfficientNet-B0 model with test-time augmentation for biomass prediction.

experiment_name: image_biomass_baseline
run_name: efficientnet_b0_tta
adapter: pytorch
description: "EfficientNet-B0 with test-time augmentation for biomass prediction"

# Hyperparameters passed to the training script
parameters:
  model_name: "efficientnet_b0"
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  image_size: 224
  use_tta: true
  pretrained: true

# MLflow tags for organizing and filtering experiments
tags:
  model_type: "cnn"
  purpose: "baseline"
  phase: "single_model"

# Random seed for reproducibility
random_seed: 42
