# EfficientNet Learning Rate Optimization
#
# This config demonstrates hyperparameter optimization for a PyTorch EfficientNet
# model, searching for the optimal learning rate using log-scale sampling.
#
# Usage:
#   exp-run-optimize examples/configs/optimization/01_effnet_lr_search.yaml --verbose
#   exp-run-optimize 01_effnet_lr_search.yaml --n-trials 50 --n-jobs 4

experiment_name: image_biomass_baseline
run_name: effnet_b0_lr_search
adapter: pytorch
description: Learning rate optimization for EfficientNet-B0

# Base parameters (fixed during optimization)
parameters:
  model_name: efficientnet_b0
  batch_size: 16
  epochs: 30
  image_size: 224
  use_tta: false
  pretrained: true

tags:
  model_type: cnn
  optimization: learning_rate
  purpose: hyperparameter_search

random_seed: 42

# Hyperparameter optimization configuration
optimization:
  # Number of trials to run
  n_trials: 100

  # Study name for persistence (resumes if study exists)
  study_name: effnet_b0_learning_rate_search

  # Optimization direction (minimize RMSE, maximize R2)
  direction: minimize

  # Metric to optimize (must match metric logged by training script)
  metric: val.rmse

  # Search space definition
  search:
    # Learning rate with log-scale sampling (recommended for LR)
    learning_rate:
      type: float
      low: 0.00001  # 1e-5
      high: 0.1     # 1e-1
      log: true     # Log-scale sampling

  # Pruner configuration for early stopping
  pruner:
    type: median
    n_startup_trials: 5   # Don't prune until 5 trials complete
    n_warmup_steps: 10    # Don't prune until step 10 in each trial
    interval_steps: 1     # Check pruning every step

  # Optional: Study timeout in seconds (None for no limit)
  # timeout: 3600  # 1 hour max
